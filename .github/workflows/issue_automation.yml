name: issue-automation

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  automate-issues-labels:
    runs-on: ubuntu-latest
    steps:
      - name: initial labeling
        # Same behavior as the former andymckay/labeler step, which ran
        # on the long-removed Node.js 12: label new issues that aren't
        # already assigned.
        if: ${{ github.event.issue.assignees[0] == null }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "needs triage"
