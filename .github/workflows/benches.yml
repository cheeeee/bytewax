name: benchmarks

on:
  push:
    branches:
      - "main"
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read
  # CodSpeed authenticates uploads with GitHub OIDC; no token secret.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.11"
          python-version: "3.12"
          activate-environment: true
          venv-path: venv
      - uses: dsherret/rust-toolchain-file@v1
      - uses: extractions/setup-just@v2
      - name: Prep build venv
        shell: bash
        run: uv pip sync --strict requirements/build-py3.12.txt
      - name: Build wheel
        shell: bash
        run: just build
      - name: Install wheel
        shell: bash
        run: |
          WHEEL_FILE=$(ls ./dist/*.whl)
          uv pip install -v --no-deps $WHEEL_FILE
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          # CPU simulation counts instructions instead of timing, so
          # results are stable on shared GitHub-hosted runners.
          mode: simulation
          run: just test-benchmark
