name: benchmarks

on:
  push:
    branches:
      - "main"
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read
  # CodSpeed authenticates uploads with GitHub OIDC; no token secret.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: benchmarks (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: simulation
            markers: "not benchmark_walltime"
          - mode: walltime
            markers: "benchmark_walltime"
    env:
      # Show the current benchmark even if it never finishes.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.11"
          python-version: "3.12"
          activate-environment: true
          venv-path: venv
      - uses: dsherret/rust-toolchain-file@v1
      - uses: extractions/setup-just@v4
      - name: Prep build venv
        shell: bash
        run: uv pip sync --strict requirements/build-py3.12.txt
      - name: Build wheel
        shell: bash
        run: just build
      - name: Install wheel
        shell: bash
        run: |
          WHEEL_FILE=$(ls ./dist/*.whl)
          uv pip install -v --no-deps $WHEEL_FILE
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        timeout-minutes: 10
        with:
          # Valgrind serializes worker threads; the four-worker fan-out
          # benchmark stalled in simulation. Keep measuring it with
          # walltime, whose results are noisier on shared runners.
          mode: ${{ matrix.mode }}
          run: >-
            pytest --codspeed -m '${{ matrix.markers }}'
            -o faulthandler_timeout=120 pytests/
