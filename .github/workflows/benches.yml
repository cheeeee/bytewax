name: CodSpeed stall diagnostics
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [investigate, validate]
        default: validate
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64-3.12
          run-id: 39475555986
          github-token: ${{ github.token }}
          path: wheel
      - name: Install pinned reproduction environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gdb libc6-dbg python3-venv
          curl -Lf -o /tmp/valgrind.deb https://github.com/CodSpeedHQ/valgrind-codspeed/releases/download/3.26.0-0codspeed9/valgrind_3.26.0-0codspeed9_ubuntu-24.04_amd64.deb
          sudo dpkg -i /tmp/valgrind.deb
          /usr/bin/python3 -m venv venv
          venv/bin/pip install wheel/*.whl pytest==9.1.1 pytest-codspeed==5.0.3
          valgrind --version
          venv/bin/python --version
      - name: Capture bounded reproductions and guest thread stacks
        if: inputs.stage == 'investigate'
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          for case in native none simulation fair no-perf; do
            venv/bin/python benchmark/codspeed_diagnostics/supervise.py "$case" --output diagnostics
          done
      - name: Validate minimal reproducer and repeated fair scheduling
        if: inputs.stage == 'validate'
        run: |
          cc -O2 -g -pthread benchmark/codspeed_diagnostics/starvation.c -o /tmp/starvation
          venv/bin/python benchmark/codspeed_diagnostics/supervise.py simulation --output diagnostics/minimal --program /tmp/starvation --timeout 35
          venv/bin/python benchmark/codspeed_diagnostics/supervise.py fair --output diagnostics/minimal --program /tmp/starvation --timeout 35
          for attempt in 1 2 3; do
            venv/bin/python benchmark/codspeed_diagnostics/supervise.py fair --output "diagnostics/repeat-$attempt"
          done
          venv/bin/pip install -r requirements/build-py3.12.txt
          echo "$PWD/venv/bin" >> "$GITHUB_PATH"
      - name: Validate actual CodSpeed action on all 12 benchmarks
        if: inputs.stage == 'validate'
        uses: CodSpeedHQ/action@v5
        timeout-minutes: 10
        env:
          CODSPEED_EXPERIMENTAL_FAIR_SCHED: 'true'
          PYTHONUNBUFFERED: '1'
        with:
          runner-version: '5.5.0'
          mode: simulation
          run: pytest --codspeed -o faulthandler_timeout=120 pytests/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codspeed-stall-diagnostics
          path: |
            diagnostics/**/*.log
            diagnostics/**/*.json
