name: benchmarks

on:
  push:
    branches:
      - "main"
  pull_request: {}
  workflow_dispatch:
    inputs:
      suite:
        description: "Benchmark suite (hotpaths is the bounded A/B shortlist)"
        type: choice
        default: all
        options:
          - all
          - hotpaths
      revision:
        description: "Optional existing commit in this fork to benchmark"
        type: string
        default: ""
      part:
        description: "Split expensive baseline simulations without changing their inputs"
        type: choice
        default: all
        options:
          - all
          - remainder
          - dense-large

permissions:
  contents: read
  # CodSpeed authenticates uploads with GitHub OIDC; no token secret.
  id-token: write

concurrency:
  # Manual A/B runs retain their pinned commit when the branch advances.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref_name }}
  cancel-in-progress: true

jobs:
  benchmarks:
    runs-on: ubuntu-24.04
    # A large unoptimized count can exceed 25 minutes under Valgrind alone.
    # Native screening retains its independent 55-second deadline.
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.11"
          python-version: "3.12"
          activate-environment: true
          venv-path: venv
      - uses: dsherret/rust-toolchain-file@v1
      - uses: extractions/setup-just@v4
      - name: Prep build venv
        shell: bash
        run: uv pip sync --strict requirements/build-py3.12.txt
      - name: Build wheel
        shell: bash
        run: just build
      - name: Install wheel
        shell: bash
        run: |
          WHEEL_FILE=$(ls ./dist/*.whl)
          uv pip install -v --no-deps "$WHEEL_FILE"
      - name: Native hot-path screening
        if: inputs.suite == 'hotpaths' && inputs.part != 'dense-large'
        shell: bash
        run: |
          mkdir -p ab-results
          python benchmarks/codspeed/native.py --output ab-results/native.json
      - name: Run benchmarks
        id: codspeed
        uses: CodSpeedHQ/action@v5
        env:
          CODSPEED_EXPERIMENTAL_FAIR_SCHED: "true"
        with:
          # CPU simulation counts instructions instead of timing, so
          # results are stable on shared GitHub-hosted runners.
          mode: simulation
          runner-version: "5.5.0"
          run: ${{ inputs.suite != 'hotpaths' && 'just test-benchmark' || inputs.part == 'dense-large' && 'pytest --codspeed benchmarks/codspeed/test_hotpaths.py -k count_dense_file-100000' || inputs.part == 'remainder' && 'pytest --codspeed benchmarks/codspeed/test_hotpaths.py -k "not count_dense_file-100000"' || 'pytest --codspeed benchmarks/codspeed/test_hotpaths.py' }}
      - name: Collect A/B evidence
        if: always() && inputs.suite == 'hotpaths'
        env:
          CODSPEED_RUN_ID: ${{ steps.codspeed.outputs.run-id }}
        run: |
          python benchmarks/codspeed/capture.py
          # Historical capture.py versions used GITHUB_SHA. When checking out
          # a requested revision, distinguish it from the workflow commit.
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path = Path("ab-results/codspeed.json")
          data = json.loads(path.read_text())
          data["workflow_commit"] = os.environ["GITHUB_SHA"]
          data["commit"] = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v6
        if: always() && inputs.suite == 'hotpaths'
        with:
          name: hotpaths-${{ inputs.part }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ab-results
          if-no-files-found: error
