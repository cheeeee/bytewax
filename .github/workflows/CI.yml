name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
  pull_request: {}
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pre-pull:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Pre-pull Docker images
        run: |
          docker pull alpine:latest &
          docker pull buildpack-deps:22.04 &
          docker pull ubuntu:22.04 &
          docker pull confluentinc/cp-kafka:7.7.1 &
          docker pull quay.io/pypa/manylinux2014_x86_64:latest &
          docker pull ghcr.io/rust-cross/manylinux2014-cross:aarch64 &
          docker pull ghcr.io/rust-cross/manylinux2014-cross:armv7 &
          wait
      - name: Create Docker-in-Docker path symlink
        run: |
          # Jobs running in a container use /__w/ paths. Cross-compile
          # Docker containers need this path on the HOST for bind mounts
          # to resolve via the host Docker daemon.
          # Use Docker for root access (runner user has no passwordless sudo).
          docker run --rm -v /:/host alpine sh -c '
            if [ -d /host/__w ] && [ ! -L /host/__w ]; then
              rm -rf /host/__w
            fi
            ln -sfn /opt/actions-runner/_work /host/__w
          '

  repo-checks:
    needs: pre-pull
    runs-on: [self-hosted, Linux, X64]
    # Run inside a container for clean environment and no sudo needed.
    # buildpack-deps:22.04 includes gcc, make, pkg-config, libssl-dev, git, curl.
    container:
      image: buildpack-deps:22.04
    env:
      UV_LINK_MODE: copy
    steps:
      - name: Fix workspace permissions
        run: chmod -R a+rwX "${{ github.workspace }}" 2>/dev/null || true
      - name: Create sudo wrapper
        run: printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo && chmod +x /usr/local/bin/sudo
      - name: Checkout
        uses: actions/checkout@v6
      # actions/checkout sets safe.directory in a temp HOME; re-set it
      # globally so git works in subsequent steps (pre-commit, etc.)
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.local/bin/
            target/
          key: ${{ runner.os }}-cargo-repo-checks-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-repo-checks-
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "requirements/**"
      - run: uv python install
      - run: echo "$(dirname $(uv python find))" >> $GITHUB_PATH
      - uses: extractions/setup-just@v3
      # Need this because we're running `cargo clippy` and `fmt`
      # directly.
      - uses: dsherret/rust-toolchain-file@v1
      - run: rustup default "$(rustup toolchain list | awk '{print $1}' | head -1)"
      - name: Install cbfmt
        run: |
            mkdir -p "$HOME/.local/bin"
            echo "$HOME/.local/bin" >> $GITHUB_PATH
            if [ ! -f "$HOME/.local/bin/cbfmt" ]; then
              mkdir /tmp/cbfmt && cd $_
              curl -fsSL -o cbfmt.tar.gz "https://github.com/lukas-reineke/cbfmt/releases/download/v0.2.0/cbfmt_linux-x86_64_v0.2.0.tar.gz"
              tar --strip-components 1 -xvf cbfmt.tar.gz
              mv cbfmt "$HOME/.local/bin/"
            fi
      # Run pre-commit before compilation — fast fail on formatting issues.
      # pre-commit only needs ruff and cbfmt (already on PATH), not bytewax.
      - name: Prep pre-commit venv
        shell: bash
        run: |
          uv venv -p 3.12 venv/
          . venv/bin/activate
          uv pip install pre-commit ruff
      - name: Check pre-commit hooks
        shell: bash
        run: |
          . venv/bin/activate
          just lint-pc
      # Build wheel via maturin-action (avoids OOM from in-process
      # cargo build during `uv pip sync -e .`). No sccache — the GHA
      # sccache server can't start reliably inside container jobs.
      - name: Prep build venv
        shell: bash
        run: |
          . venv/bin/activate
          uv pip sync --strict requirements/build-py3.12.txt
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: -C force-frame-pointers=yes
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          target: x86_64
          args: --release --out dist/ -i 3.12
          sccache: false
      - name: Install wheel and dev dependencies
        shell: bash
        run: |
          . venv/bin/activate
          WHEEL_FILE=$(ls ./dist/*.whl)
          uv pip install -v --no-deps $WHEEL_FILE
          # Install all pinned dev deps except `-e .` (bytewax already installed from wheel)
          sed '/^-e /d' requirements/dev.txt > /tmp/dev-deps.txt
          uv pip install -r /tmp/dev-deps.txt
      - name: Run lints
        shell: bash
        run: |
          . venv/bin/activate
          just lint
      - name: Audit Rust dependencies
        shell: bash
        run: |
          which cargo-deny || cargo install cargo-deny --locked
          cargo deny check
      - name: Audit Python dependencies
        shell: bash
        # pip-audit is advisory-only: dev lockfiles pin transitive deps
        # (requests, urllib3, etc.) that may lag behind patches.
        # Fail the step only when bytewax's own deps are vulnerable.
        continue-on-error: true
        run: |
          . venv/bin/activate
          pip-audit
      - name: Run Rust tests
        shell: bash
        run: |
          . venv/bin/activate
          export LD_LIBRARY_PATH="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          just test-rs
      - name: Run documentation tests
        shell: bash
        run: |
          . venv/bin/activate
          just test-doc
      # Container runs as root; fix ownership so later jobs (running as
      # the host runner user) can clean up the shared workspace.
      - name: Fix workspace permissions
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"

  linux:
    needs: pre-pull
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        target: ['x86_64', 'aarch64', 'armv7']
    runs-on: [self-hosted, Linux, X64]
    container:
      image: buildpack-deps:22.04
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /usr/bin/docker:/usr/bin/docker
    env:
      UV_LINK_MODE: copy
    # Kafka service container for integration tests (KRaft mode, no Zookeeper).
    # Only used for x86_64 tests (cross-compiled targets skip tests).
    services:
      kafka:
        image: confluentinc/cp-kafka:7.7.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    steps:
      - name: Fix workspace permissions
        run: chmod -R a+rwX "${{ github.workspace }}" 2>/dev/null || true
      # maturin-action post-build runs "sudo chown" for permission fix.
      # Container runs as root so sudo is unnecessary; provide a no-op wrapper.
      - name: Create sudo wrapper
        run: printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo && chmod +x /usr/local/bin/sudo
      - uses: actions/checkout@v6
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "requirements/**"
      - run: uv python install
      - run: echo "$(dirname $(uv python find))" >> $GITHUB_PATH
      - uses: extractions/setup-just@v3
      - uses: dsherret/rust-toolchain-file@v1
      - run: rustup default "$(rustup toolchain list | awk '{print $1}' | head -1)"
      - name: Prep build venv
        shell: bash
        run: |
          uv venv -p ${{ matrix.python-version }} venv/
          . venv/bin/activate
          uv pip sync --strict requirements/build-py${{ matrix.python-version }}.txt || {
            echo "::warning::uv pip sync failed, clearing cache and retrying"
            uv cache clean
            uv pip sync --strict requirements/build-py${{ matrix.python-version }}.txt
          }
      # Cross-compile targets (aarch64, armv7) use Docker-in-Docker via
      # maturin-action. The action creates a script at $RUNNER_TEMP/run-maturin-action.sh
      # but Docker (on the host) bind-mounts it via /__w/_temp/. The pre-pull job
      # creates the /__w -> /opt/actions-runner/_work symlink on ONE runner; ensure
      # it exists on THIS runner too.
      - name: Ensure Docker-in-Docker path symlink
        if: ${{ matrix.target != 'x86_64' }}
        run: |
          docker run --rm -v /:/host alpine:latest sh -c '
            if [ -d /host/__w ] && [ ! -L /host/__w ]; then
              rm -rf /host/__w
            fi
            ln -sfn /opt/actions-runner/_work /host/__w
          '
      # Also clean stale directory at the script path — if a previous job
      # crashed before cleanup, Docker may have auto-created a directory there.
      - name: Clean stale maturin temp script
        if: ${{ matrix.target != 'x86_64' }}
        run: |
          for SCRIPT in "${{ runner.temp }}/run-maturin-action.sh" "/__w/_temp/run-maturin-action.sh"; do
            if [ -d "$SCRIPT" ]; then
              echo "::warning::Removing stale directory at $SCRIPT"
              rm -rf "$SCRIPT"
            fi
          done
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: -C force-frame-pointers=yes
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.target == 'x86_64' && 'auto' || '2_28' }}
          args: --release --out dist/ -i ${{ matrix.python-version }}
          sccache: true
      - name: Run Python tests
        if: ${{ matrix.target == 'x86_64' }}
        shell: bash
        env:
          TEST_KAFKA_BROKER: kafka:9092
        run: |
          . venv/bin/activate
          WHEEL_FILE=$(ls ./dist/*.whl)
          uv pip install -v --no-deps $WHEEL_FILE
          just test-py
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist
          retention-days: 7
      - name: Fix workspace permissions
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"

  macos:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        target: ['x86_64', 'aarch64']
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv python install
      - run: echo "$(dirname $(uv python find))" >> $GITHUB_PATH
      - uses: extractions/setup-just@v3
      - uses: dsherret/rust-toolchain-file@v1
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: -C force-frame-pointers=yes
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          target: ${{ matrix.target }}
          args: --release --out dist/ -i ${{ matrix.python-version }}
      - name: Run Python tests
        # Only run tests for the host architecture (aarch64 on macos-latest).
        # x86_64 wheels are cross-compiled; Kafka tests are skipped (no Docker).
        if: ${{ matrix.target == 'aarch64' }}
        shell: bash
        run: |
          uv venv -p ${{ matrix.python-version }} venv/
          . venv/bin/activate
          if ! uv pip sync --strict requirements/build-py${{ matrix.python-version }}.txt; then
            echo "::warning::Dependency install failed (likely missing binary wheels). Skipping tests."
            exit 0
          fi
          WHEEL_FILE=$(ls ./dist/*.whl)
          uv pip install -v --no-deps $WHEEL_FILE
          just test-py
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  windows:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv python install
      - shell: bash
        run: echo "$(dirname $(uv python find))" >> $GITHUB_PATH
      - uses: extractions/setup-just@v3
      - uses: dsherret/rust-toolchain-file@v1
      - name: Find Python interpreter
        id: python-path
        shell: bash
        run: echo "path=$(uv python find)" >> $GITHUB_OUTPUT
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: -C force-frame-pointers=yes
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          args: --release --out dist/ -i ${{ steps.python-path.outputs.path }}
          sccache: true
      - name: Run Python tests
        shell: bash
        run: |
          uv venv -p ${{ matrix.python-version }} venv/
          . venv/Scripts/activate
          if ! uv pip sync --strict requirements/build-py${{ matrix.python-version }}.txt; then
            echo "::warning::Dependency install failed (likely missing binary wheels). Skipping tests."
            exit 0
          fi
          WHEEL_FILE=$(ls ./dist/*.whl)
          uv pip install -v --no-deps $WHEEL_FILE
          just test-py
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.python-version }}
          path: dist

  rust-bench:
    needs: [pre-pull]
    runs-on: [self-hosted, Linux, X64, Intel]
    container:
      image: buildpack-deps:22.04
    env:
      UV_LINK_MODE: copy
    steps:
      - name: Fix workspace permissions
        run: chmod -R a+rwX "${{ github.workspace }}" 2>/dev/null || true
      - name: Create sudo wrapper
        run: printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo && chmod +x /usr/local/bin/sudo
      - uses: actions/checkout@v6
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-perf-
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv python install
      - run: echo "$(dirname $(uv python find))" >> $GITHUB_PATH
      - uses: dsherret/rust-toolchain-file@v1
      - run: rustup default "$(rustup toolchain list | awk '{print $1}' | head -1)"
      - name: Run Rust criterion benchmarks
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          cargo bench --bench pyo3_extensions --no-default-features -- --output-format bencher 2>&1 | tee /tmp/bench-results.txt
      - name: Post benchmark results
        if: always()
        shell: bash
        run: |
          echo "## Rust Criterion Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmark | ns/iter | +/- |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---:|---:|" >> $GITHUB_STEP_SUMMARY
          grep "^test " /tmp/bench-results.txt | while read -r line; do
            name=$(echo "$line" | sed 's/^test \(.*\) \.\.\. bench:.*/\1/')
            nsiter=$(echo "$line" | sed 's/.*bench: *\([0-9,]*\) ns\/iter.*/\1/' | tr -d ',')
            plusminus=$(echo "$line" | sed 's/.*+\/- \([0-9,]*\)).*/\1/' | tr -d ',')
            echo "| $name | $nsiter | $plusminus |" >> $GITHUB_STEP_SUMMARY
          done
      - name: Fix workspace permissions
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"

  benchmarks:
    needs: [linux]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: [self-hosted, Linux, X64, Intel]
    steps:
      - name: Fix workspace permissions
        run: |
          chmod -R a+rwX "${{ github.workspace }}" 2>/dev/null || true
          rm -rf "${{ github.workspace }}/venv" "${{ github.workspace }}/.ruff_cache" 2>/dev/null || true
      - uses: actions/checkout@v6
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "requirements/**"
      - run: uv python install
      - run: echo "$(dirname $(uv python find))" >> $GITHUB_PATH
      - uses: extractions/setup-just@v3
      - name: Download wheel
        uses: actions/download-artifact@v7
        with:
          name: wheels-linux-x86_64-${{ matrix.python-version }}
          path: dist/
      - name: Prep benchmark venv
        shell: bash
        run: |
          uv venv -p ${{ matrix.python-version }} venv/
          . venv/bin/activate
          uv pip sync --strict requirements/build-py${{ matrix.python-version }}.txt
      - name: Install wheel
        shell: bash
        run: |
          . venv/bin/activate
          WHEEL_FILE=$(ls ./dist/*.whl)
          uv pip install -v --no-deps $WHEEL_FILE
      - name: Add cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        env:
          CODSPEED_BENCHMARK_PREFIX: py${{ matrix.python-version }}
        with:
          mode: walltime
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: |
            . venv/bin/activate
            set +e
            just test-benchmark
            rc=$?
            set -e
            if [ $rc -eq 139 ]; then
              echo "::warning::SIGSEGV (exit 139) during CodSpeed walltime shutdown — known Python 3.13+ issue (benchmarks already captured)"
            elif [ $rc -ne 0 ]; then
              exit $rc
            fi
      - name: Fix workspace permissions
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE" 2>/dev/null || true

  python-bench:
    needs: [linux]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: [self-hosted, Linux, X64, Intel]
    steps:
      - name: Fix workspace permissions
        run: |
          chmod -R a+rwX "${{ github.workspace }}" 2>/dev/null || true
          rm -rf "${{ github.workspace }}/venv" "${{ github.workspace }}/.ruff_cache" 2>/dev/null || true
      - uses: actions/checkout@v6
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "requirements/**"
      - run: uv python install
      - run: echo "$(dirname $(uv python find))" >> $GITHUB_PATH
      - name: Download wheel
        uses: actions/download-artifact@v7
        with:
          name: wheels-linux-x86_64-${{ matrix.python-version }}
          path: dist/
      - name: Prep benchmark venv
        shell: bash
        run: |
          uv venv -p ${{ matrix.python-version }} venv/
          . venv/bin/activate
          uv pip sync --strict requirements/build-py${{ matrix.python-version }}.txt
      - name: Install wheel
        shell: bash
        run: |
          . venv/bin/activate
          WHEEL_FILE=$(ls ./dist/*.whl)
          uv pip install -v --no-deps $WHEEL_FILE
      - name: Run benchmarks
        shell: bash
        run: |
          . venv/bin/activate
          pytest pytests/test_passthrough_bench.py \
            --benchmark-only \
            --benchmark-json=results-py${{ matrix.python-version }}.json \
            -v
      - name: Post benchmark results
        if: always()
        shell: bash
        run: |
          echo "## Python ${{ matrix.python-version }} Benchmark Results" >> $GITHUB_STEP_SUMMARY
          if [ -f results-py${{ matrix.python-version }}.json ]; then
            . venv/bin/activate
            python3 -c "
          import json, sys
          with open('results-py${{ matrix.python-version }}.json') as f:
              data = json.load(f)
          print('| Benchmark | Mean (ms) | StdDev (ms) | Throughput (items/s) | Rounds |')
          print('|---|---:|---:|---:|---:|')
          for b in data.get('benchmarks', []):
              name = b['name']
              mean_s = b['stats']['mean']
              mean_ms = mean_s * 1000
              stddev_ms = b['stats']['stddev'] * 1000
              rounds = b['stats']['rounds']
              throughput = int(1 / mean_s) if mean_s > 0 else 0
              print(f'| {name} | {mean_ms:.1f} | {stddev_ms:.1f} | {throughput:,} | {rounds} |')
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "No results file found." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results-py${{ matrix.python-version }}
          path: results-py${{ matrix.python-version }}.json
          retention-days: 30
      - name: Fix workspace permissions
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE" 2>/dev/null || true

  kafka-bench:
    needs: [linux]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: [self-hosted, Linux, X64, Intel]
    steps:
      - name: Fix workspace permissions
        run: |
          chmod -R a+rwX "${{ github.workspace }}" 2>/dev/null || true
          rm -rf "${{ github.workspace }}/venv" "${{ github.workspace }}/.ruff_cache" 2>/dev/null || true
      - uses: actions/checkout@v6
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "requirements/**"
      - run: uv python install
      - run: echo "$(dirname $(uv python find))" >> $GITHUB_PATH
      - name: Download wheel
        uses: actions/download-artifact@v7
        with:
          name: wheels-linux-x86_64-${{ matrix.python-version }}
          path: dist/
      - name: Prep benchmark venv
        shell: bash
        run: |
          uv venv -p ${{ matrix.python-version }} venv/
          . venv/bin/activate
          uv pip sync --strict requirements/build-py${{ matrix.python-version }}.txt
      - name: Install wheel
        shell: bash
        run: |
          . venv/bin/activate
          WHEEL_FILE=$(ls ./dist/*.whl)
          uv pip install -v --no-deps $WHEEL_FILE
      - name: Start Kafka
        shell: bash
        run: |
          docker rm -f kafka-bench 2>/dev/null || true
          docker run -d --name kafka-bench \
            -p 19092:19092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:19092 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=false \
            confluentinc/cp-kafka:7.7.1
      - name: Wait for Kafka readiness
        shell: bash
        run: |
          echo "Waiting for Kafka to be ready on localhost:19092..."
          for i in $(seq 1 60); do
            if docker exec kafka-bench kafka-topics --bootstrap-server localhost:19092 --list 2>/dev/null; then
              echo "Kafka is ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Kafka failed to start within 60 seconds"
              docker logs kafka-bench
              exit 1
            fi
            sleep 1
          done
      - name: Run Kafka benchmarks
        shell: bash
        env:
          TEST_KAFKA_BROKER: localhost:19092
        run: |
          . venv/bin/activate
          pytest pytests/test_kafka_bench.py \
            --benchmark-only \
            --benchmark-json=kafka-results-py${{ matrix.python-version }}.json \
            -v
      - name: Post benchmark results
        if: always()
        shell: bash
        run: |
          echo "## Kafka Benchmark - Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          if [ -f kafka-results-py${{ matrix.python-version }}.json ]; then
            . venv/bin/activate
            python3 -c "
          import json, sys
          with open('kafka-results-py${{ matrix.python-version }}.json') as f:
              data = json.load(f)
          print('| Benchmark | Mean (ms) | StdDev (ms) | Throughput (items/s) | Rounds |')
          print('|---|---:|---:|---:|---:|')
          for b in data.get('benchmarks', []):
              name = b['name']
              mean_s = b['stats']['mean']
              mean_ms = mean_s * 1000
              stddev_ms = b['stats']['stddev'] * 1000
              rounds = b['stats']['rounds']
              throughput = int(1 / mean_s) if mean_s > 0 else 0
              print(f'| {name} | {mean_ms:.1f} | {stddev_ms:.1f} | {throughput:,} | {rounds} |')
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "No results file found." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kafka-perf-results-py${{ matrix.python-version }}
          path: kafka-results-py${{ matrix.python-version }}.json
          retention-days: 30
      - name: Stop Kafka
        if: always()
        run: docker rm -f kafka-bench 2>/dev/null || true
      - name: Fix workspace permissions
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE" 2>/dev/null || true

  ci-pass:
    if: always()
    needs: [repo-checks, linux, macos, windows, rust-bench, benchmarks, python-bench, kafka-bench]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
