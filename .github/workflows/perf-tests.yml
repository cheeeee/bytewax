name: perf-tests

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  rust-bench:
    # Skip if CI failed (workflow_run trigger only)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux, X64, Intel]
    container:
      image: buildpack-deps:22.04
    env:
      UV_LINK_MODE: copy
    steps:
      - name: Fix workspace permissions
        run: chmod -R a+rwX "${{ github.workspace }}" 2>/dev/null || true
      - name: Create sudo wrapper
        run: printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo && chmod +x /usr/local/bin/sudo
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-perf-
      # Need Python for PyO3 build (criterion benchmarks link against libpython)
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv python install
      - run: echo "$(dirname $(uv python find))" >> $GITHUB_PATH
      - uses: dsherret/rust-toolchain-file@v1
      - run: rustup default "$(rustup toolchain list | awk '{print $1}' | head -1)"
      - name: Run Rust criterion benchmarks
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          cargo bench --bench pyo3_extensions --no-default-features -- --output-format bencher 2>&1 | tee /tmp/bench-results.txt
      - name: Post benchmark results
        if: always()
        shell: bash
        run: |
          echo "## Rust Criterion Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmark | ns/iter | +/- |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---:|---:|" >> $GITHUB_STEP_SUMMARY
          grep "^test " /tmp/bench-results.txt | while read -r line; do
            name=$(echo "$line" | sed 's/^test \(.*\) \.\.\. bench:.*/\1/')
            nsiter=$(echo "$line" | sed 's/.*bench: *\([0-9,]*\) ns\/iter.*/\1/' | tr -d ',')
            plusminus=$(echo "$line" | sed 's/.*+\/- \([0-9,]*\)).*/\1/' | tr -d ',')
            echo "| $name | $nsiter | $plusminus |" >> $GITHUB_STEP_SUMMARY
          done
      - name: Fix workspace permissions
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"

  wheels:
    # Skip if CI failed (workflow_run trigger only)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: [self-hosted, Linux, X64, Intel]
    container:
      image: buildpack-deps:22.04
    env:
      UV_LINK_MODE: copy
    steps:
      - name: Fix workspace permissions
        run: chmod -R a+rwX "${{ github.workspace }}" 2>/dev/null || true
      - name: Create sudo wrapper
        run: printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo && chmod +x /usr/local/bin/sudo

      # --- Download from CI (workflow_run trigger) ---
      - name: Download wheel from CI
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v16
        with:
          workflow: CI.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: wheels-linux-x86_64-${{ matrix.python-version }}
          path: dist/

      # --- Build locally (workflow_dispatch fallback) ---
      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_dispatch'
      - name: Mark workspace safe for git
        if: github.event_name == 'workflow_dispatch'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-perf-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-perf-build-
      - uses: astral-sh/setup-uv@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "requirements/**"
      - run: uv python install
        if: github.event_name == 'workflow_dispatch'
      - run: echo "$(dirname $(uv python find))" >> $GITHUB_PATH
        if: github.event_name == 'workflow_dispatch'
      - uses: dsherret/rust-toolchain-file@v1
        if: github.event_name == 'workflow_dispatch'
      - run: rustup default "$(rustup toolchain list | awk '{print $1}' | head -1)"
        if: github.event_name == 'workflow_dispatch'
      - name: Prep build venv
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          uv venv -p ${{ matrix.python-version }} venv/
          . venv/bin/activate
          uv pip sync --strict requirements/build-py${{ matrix.python-version }}.txt
      - name: Build wheel
        if: github.event_name == 'workflow_dispatch'
        uses: PyO3/maturin-action@v1
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: -C force-frame-pointers=yes
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          target: x86_64
          args: --release --out dist/ -i ${{ matrix.python-version }}
          sccache: true

      # --- Upload wheel (both paths) ---
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: perf-wheel-${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 1
      - name: Fix workspace permissions
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"

  python-bench:
    needs: [wheels]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: [self-hosted, Linux, X64, Intel]
    # No container — runs on bare metal for stable performance measurements
    steps:
      - name: Fix workspace permissions
        run: |
          chmod -R a+rwX "${{ github.workspace }}" 2>/dev/null || true
          rm -rf "${{ github.workspace }}/venv" "${{ github.workspace }}/.ruff_cache" 2>/dev/null || true
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "requirements/**"
      - run: uv python install
      - run: echo "$(dirname $(uv python find))" >> $GITHUB_PATH
      - name: Download wheel
        uses: actions/download-artifact@v7
        with:
          name: perf-wheel-${{ matrix.python-version }}
          path: dist/
      - name: Prep benchmark venv
        shell: bash
        run: |
          uv venv -p ${{ matrix.python-version }} venv/
          . venv/bin/activate
          uv pip sync --strict requirements/build-py${{ matrix.python-version }}.txt
      - name: Install wheel
        shell: bash
        run: |
          . venv/bin/activate
          WHEEL_FILE=$(ls ./dist/*.whl)
          uv pip install -v --no-deps $WHEEL_FILE
      - name: Run benchmarks
        shell: bash
        run: |
          . venv/bin/activate
          pytest pytests/test_passthrough_bench.py \
            --benchmark-only \
            --benchmark-json=results-py${{ matrix.python-version }}.json \
            -v
      - name: Post benchmark results
        if: always()
        shell: bash
        run: |
          echo "## Python ${{ matrix.python-version }} Benchmark Results" >> $GITHUB_STEP_SUMMARY
          if [ -f results-py${{ matrix.python-version }}.json ]; then
            . venv/bin/activate
            python3 -c "
          import json, sys
          with open('results-py${{ matrix.python-version }}.json') as f:
              data = json.load(f)
          print('| Benchmark | Mean (ms) | StdDev (ms) | Throughput (items/s) | Rounds |')
          print('|---|---:|---:|---:|---:|')
          for b in data.get('benchmarks', []):
              name = b['name']
              mean_s = b['stats']['mean']
              mean_ms = mean_s * 1000
              stddev_ms = b['stats']['stddev'] * 1000
              rounds = b['stats']['rounds']
              throughput = int(1 / mean_s) if mean_s > 0 else 0
              print(f'| {name} | {mean_ms:.1f} | {stddev_ms:.1f} | {throughput:,} | {rounds} |')
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "No results file found." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results-py${{ matrix.python-version }}
          path: results-py${{ matrix.python-version }}.json
          retention-days: 30
      - name: Fix workspace permissions
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE" 2>/dev/null || true

  perf-tests-pass:
    if: always()
    needs: [rust-bench, python-bench]
    runs-on: [self-hosted, Linux, X64, Intel]
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
