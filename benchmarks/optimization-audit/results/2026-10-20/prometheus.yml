global:
  scrape_interval: 200ms
scrape_configs:
  - job_name: before
    metrics_path: /before
    static_configs:
      - targets: ['127.0.0.1:53907']
  - job_name: after
    metrics_path: /after
    static_configs:
      - targets: ['127.0.0.1:53907']
  - job_name: drop_conflicting_family
    metrics_path: /after
    static_configs:
      - targets: ['127.0.0.1:53907']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: bytewax_partd_write_duration_seconds_(bucket|sum|count)
        action: drop
